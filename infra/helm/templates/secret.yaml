apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-compliance-engine.fullname" . }}-secrets
  labels:
    {{- include "ai-compliance-engine.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: "{{ .Values.secrets.databaseUrl }}"
  redis-url: "{{ .Values.secrets.redisUrl }}"
  embedding-api-key: "{{ .Values.secrets.embeddingApiKey }}"
  reasoning-api-key: "{{ .Values.secrets.reasoningApiKey }}"
  jwt-secret: "{{ .Values.secrets.jwtSecret }}"
