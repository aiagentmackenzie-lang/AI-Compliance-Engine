# AI Compliance Engine Helm Values

replicaCount: 2

image:
  repository: ai-compliance-engine
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ace.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Application Configuration
config:
  nodeEnv: production
  logLevel: info
  
  database:
    poolSize: 20
    ssl:
      enabled: true
  
  rateLimit:
    requests: 100
    windowMs: 60000
  
  security:
    cors:
      origin: []
      credentials: true
  
  ai:
    embedding:
      model: text-embedding-3-small
      dimensions: 1536
      batchSize: 64
    reasoning:
      model: gpt-4o-2024-08-06
      temperature: 0

# External Dependencies
postgresql:
  enabled: true
  auth:
    database: compliance_engine
    username: ace
    existingSecret: ""
  primary:
    persistence:
      enabled: true
      size: 10Gi

redis:
  enabled: true
  auth:
    enabled: true
  master:
    persistence:
      enabled: true
      size: 5Gi

# Secrets (use external secret management in production)
secrets:
  embeddingApiKey: ""
  reasoningModelApiKey: ""
  jwtSecret: ""
  oidcClientSecret: ""
